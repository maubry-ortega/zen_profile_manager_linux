name: Python CI

on:
  push:
    branches: [ main, master, update_marzo ]
  pull_request:
    branches: [ main, master, update_marzo ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
    - name: Compilation check
      run: |
        python -m py_compile main.py zen_manager/*.py zen_manager/**/*.py
